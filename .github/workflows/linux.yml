name: linux

on:
  push:
    branches:
      - 'master'
      - 'dealii-*'
  pull_request:
    types:
    - opened
    - reopened
    - synchronize
    - ready_for_review

concurrency:
  group: ${{ github.event_name }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{github.event_name == 'pull_request'}}

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  CTEST_OUTPUT_ON_FAILURE: 1
  CTEST_PARALLEL_LEVEL: 4
  MAKEFLAGS: "--jobs=4"

jobs:

  ##################
  # release-serial #
  ##################

  release-serial:
    # simple serial release build using g++

    name: ${{ matrix.ubuntu_version }} release serial
    runs-on: ${{ matrix.os }}

    #
    # The following condition only runs the workflow on 'push' or if the
    # 'pull_request' is not a draft. This is only useful for hackathons or
    # other situations when the CI is massively overburdened with pull
    # requests.
    #
    # if: ${{ github.event_name == 'push' || !github.event.pull_request.draft }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - ubuntu_version: noble
            os: ubuntu-24.04
          - ubuntu_version: resolute
            os: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7
    - name: info
      run: |
        g++ -v
        cmake --version
    - name: configure deal.II
      run: |
        mkdir build
        cd build
        cmake -D CMAKE_BUILD_TYPE=Release \
              -D DEAL_II_CXX_FLAGS='-Werror -std=c++20' \
              -D DEAL_II_EARLY_DEPRECATIONS=ON \
              ..
    - name: print detailed.log
      run: cat build/detailed.log
    - name: build
      run: |
        cd build
        make VERBOSE=1
    - name: test
      run: |
        cd build
        make \
          setup_tests_a-framework \
          setup_tests_examples \
          setup_tests_quick_tests
        ctest -VV

  ##################
  # debug-parallel #
  ##################

  debug-parallel:
    # simple parallel debug build using g++

    name: ${{ matrix.ubuntu_version }} ${{ matrix.architecture }} debug parallel
    runs-on: ${{ matrix.os }}

    #
    # The following condition only runs the workflow on 'push' or if the
    # 'pull_request' is not a draft. This is only useful for hackathons or
    # other situations when the CI is massively overburdened with pull
    # requests.
    #
    # if: ${{ github.event_name == 'push' || !github.event.pull_request.draft }}

    strategy:
      fail-fast: false
      matrix:
        ubuntu_version: [noble, resolute]
        os: [ubuntu-26.04, ubuntu-26.04-arm]
        include:
          - os: ubuntu-26.04
            architecture: amd64
            flags:
          - os: ubuntu-26.04-arm
            architecture: arm64
            flags: -mno-outline-atomics

    container:
      image: dealii/dependencies:${{ matrix.ubuntu_version }}-v9.7.1
      options: --user root --env OMPI_ALLOW_RUN_AS_ROOT=1 --env OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1

    steps:
    - uses: actions/checkout@v7
    - name: info
      run: |
        python --version
        mpicc -v
        cmake --version
    - name: configure deal.II
      run: |
        # sanitize PYTHONPATH
        unset PYTHONPATH
        mkdir build
        cd build
        cmake -D CMAKE_BUILD_TYPE=Debug \
              -D DEAL_II_CXX_FLAGS='-Werror -std=c++20 ${{ matrix.flags }}' \
              -D DEAL_II_EARLY_DEPRECATIONS=ON \
              -D DEAL_II_COMPONENT_PYTHON_BINDINGS=ON \
              -D DEAL_II_WITH_COMPLEX_VALUES="ON" \
              -D DEAL_II_WITH_MPI="ON" \
              -D DEAL_II_WITH_CGAL="ON" \
              -D DEAL_II_WITH_HDF5="ON" \
              -D DEAL_II_WITH_NETCDF="ON" \
              -D netCDF_DIR="/usr/lib/$(arch)-linux-gnu/netcdf/mpi" \
              -D DEAL_II_WITH_METIS="ON" \
              -D DEAL_II_WITH_PETSC="ON" \
              -D DEAL_II_WITH_TRILINOS="ON" \
              -D DEAL_II_WITH_VTK="ON" \
              ..
    - name: print detailed.log
      run: cat build/detailed.log
    - name: build
      run: |
        cd build
        make VERBOSE=1
    - name: test
      run: |
        # Remove warning: "A high-performance Open MPI point-to-point
        # messaging module was unable to find any relevant network
        # interfaces."
        export OMPI_MCA_btl_base_warn_component_unused='0'
        # Disable UCX OSC to prevent errors of the kind:
        # "../ompi/mca/osc/ucx/osc_ucx_component.c:375  Error: OSC UCX
        # component priority set inside component query failed"
        export OMPI_MCA_osc='^ucx'

        cd build
        make \
          setup_tests_a-framework \
          setup_tests_examples \
          setup_tests_quick_tests
        ctest -VV

  #########################
  # debug-parallel-tpetra #
  #########################

  debug-parallel-tpetra:
    # simple parallel debug build using g++ and trilinos+tpetra

    name: ${{ matrix.ubuntu_version }} debug parallel tpetra
    runs-on: ubuntu-26.04

    #
    # The following condition only runs the workflow on 'push' or if the
    # 'pull_request' is not a draft. This is only useful for hackathons or
    # other situations when the CI is massively overburdened with pull
    # requests.
    #
    # if: ${{ github.event_name == 'push' || !github.event.pull_request.draft }}

    strategy:
      fail-fast: false
      matrix:
        ubuntu_version: [noble, resolute]

    container:
      image: dealii/dependencies:${{ matrix.ubuntu_version }}-v9.7.1
      options: --user root --env OMPI_ALLOW_RUN_AS_ROOT=1 --env OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1

    steps:
    - uses: actions/checkout@v7
    - name: info
      run: |
        mpicc -v
        cmake --version
    - name: configure deal.II
      run: |
        mkdir build
        cd build
        cmake -D CMAKE_BUILD_TYPE=Debug \
              -D DEAL_II_CXX_FLAGS='-std=c++20' \
              -D DEAL_II_EARLY_DEPRECATIONS=ON \
              -D DEAL_II_WITH_64BIT_INDICES="ON" \
              -D DEAL_II_WITH_MPI="ON" \
              -D DEAL_II_WITH_P4EST="ON" \
              -D DEAL_II_WITH_TRILINOS="ON" \
              ..
    - name: print detailed.log
      run: cat build/detailed.log
    - name: build
      run: |
        cd build
        make VERBOSE=1
    - name: test trilinos_tpetra
      run: |
        # Remove warning: "A high-performance Open MPI point-to-point
        # messaging module was unable to find any relevant network
        # interfaces."
        export OMPI_MCA_btl_base_warn_component_unused='0'

        cd build
        make setup_tests_trilinos_tpetra
        ctest -VV

  ######################
  # debug-intel-oneapi #
  ######################

  debug-intel-oneapi:
    # parallel debug build with Intel oneAPI including MPI and MKL
    #
    # Based on https://github.com/oneapi-src/oneapi-ci
    # For a list of Intel packages see https://oneapi-src.github.io/oneapi-ci/#linux-apt

    name: resolute debug intel oneapi
    runs-on: ubuntu-26.04
    container:
      image: intel/oneapi:2026.1.0-devel-ubuntu26.04

    #
    # The following condition only runs the workflow on 'push' or if the
    # 'pull_request' is not a draft. This is only useful for hackathons or
    # other situations when the CI is massively overburdened with pull
    # requests.
    #
    # if: ${{ github.event_name == 'push' || !github.event.pull_request.draft }}

    steps:
    - uses: actions/checkout@v7
    - name: info
      run: |
        export I_MPI_CXX=icpx
        mpiicpc -v
        cmake --version
    - name: configure deal.II
      run: |
        mkdir build
        cd build
        cmake -D CMAKE_BUILD_TYPE=Debug \
              -D CMAKE_CXX_COMPILER=icpx \
              -D DEAL_II_CXX_FLAGS='-Werror -Wno-error=tautological-constant-compare' \
              -D DEAL_II_EARLY_DEPRECATIONS=ON \
              -D DEAL_II_WITH_MPI=ON \
              -D DEAL_II_WITH_LAPACK=ON \
              -D DEAL_II_WITH_TBB=ON \
              -D MPI_DIR=${I_MPI_ROOT} \
              -D BLAS_DIR=${MKLROOT} \
              -D LAPACK_DIR=${MKLROOT} \
              -D TBB_DIR=${TBBROOT} \
              ..
    - name: print detailed.log
      run: cat build/detailed.log
    - name: build
      run: |
        cd build
        make VERBOSE=1
    - name: test
      run: |
        cd build
        make \
          setup_tests_a-framework \
          setup_tests_examples \
          setup_tests_quick_tests
        ctest -VV

  #################
  # debug-cuda-12 #
  #################

  debug-cuda-12:
    # simple parallel debug build using cuda-12

    name: noble debug cuda-12
    runs-on: ubuntu-24.04

    #
    # The following condition only runs the workflow on 'push' or if the
    # 'pull_request' is not a draft. This is only useful for hackathons or
    # other situations when the CI is massively overburdened with pull
    # requests.
    #
    # if: ${{ github.event_name == 'push' || !github.event.pull_request.draft }}

    env:
      CUDA_ROOT: /usr/local/cuda

    steps:
    - uses: actions/checkout@v7
    - name: modules
      run: |
        wget https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
        sudo dpkg -i cuda-keyring_1.1-1_all.deb
        sudo apt-get install -y software-properties-common
        sudo add-apt-repository ppa:ginggs/deal.ii-9.7.1-backports
        sudo apt-get update
        sudo apt-get install -yq --no-install-recommends \
            cuda-toolkit-12-8 \
            libp4est-dev \
            libopenmpi-dev \
            numdiff \
            openmpi-bin \
            libboost-all-dev
    # https://github.com/apache/flink/blob/master/tools/ci/free_disk_space.sh
    - name: remove unused large packages
      run : |
        echo "=============================================================================="
        echo "Freeing up disk space on CI system"
        echo "=============================================================================="

        echo "Listing 100 largest packages"
        dpkg-query -Wf '${Installed-Size}\t${Package}\n' | sort -n | tail -n 100
        df -h
        echo "Removing large packages"
        sudo apt-get remove -y '^dotnet-.*'
        sudo apt-get remove -y '^llvm-.*'
        sudo apt-get remove -y 'php.*'
        sudo apt-get remove -y azure-cli google-cloud-sdk google-chrome-stable firefox powershell mono-devel
        sudo apt-get autoremove -y
        sudo apt-get clean
        df -h
        echo "Removing large directories"
        # deleting 15GB
        rm -rf /usr/share/dotnet/
        df -h
    - uses: lukka/get-cmake@v4.4.2
      with:
        cmakeVersion: 3.28.3
    - name: info
      run: |
        mpicc -v
        cmake --version
    - uses: actions/checkout@v7
      with:
        repository: kokkos/kokkos
        ref: 4.0.01
        path: kokkos
    - name: compile and install kokkos
      working-directory: kokkos
      run: |
        mkdir build
        cd build
        cmake -D BUILD_SHARED_LIBS=ON \
              -D CMAKE_CXX_COMPILER=${GITHUB_WORKSPACE}/kokkos/bin/nvcc_wrapper \
              -D CMAKE_INSTALL_PREFIX=${GITHUB_WORKSPACE}/../kokkos-install \
              -D Kokkos_ENABLE_CUDA=ON \
              -D Kokkos_ENABLE_CUDA_LAMBDA=ON \
              -D Kokkos_ENABLE_CUDA_CONSTEXPR=ON \
              -D Kokkos_ARCH_AMPERE80=ON \
              ..
        make install
    - name: configure deal.II
      run: |
        mkdir build
        cd build
        cmake -D CMAKE_BUILD_TYPE=Debug \
              -D CMAKE_CXX_COMPILER=${GITHUB_WORKSPACE}/kokkos/bin/nvcc_wrapper \
              -D DEAL_II_CXX_FLAGS='-Werror -Wno-non-template-friend' \
              -D DEAL_II_EARLY_DEPRECATIONS=ON \
              -D DEAL_II_WITH_KOKKOS="ON" \
              -D KOKKOS_DIR=${GITHUB_WORKSPACE}/../kokkos-install \
              -D DEAL_II_WITH_MPI="ON" \
              -D DEAL_II_MPI_WITH_DEVICE_SUPPORT="ON" \
              -D DEAL_II_WITH_P4EST="ON" \
              ..
    - name: print detailed.log
      run: cat build/detailed.log
    - name: build deal.II
      run: |
        cd build
        make VERBOSE=1
    - name: build CUDA tests
      run: |
        cd build
        make setup_tests_matrix_free_kokkos
        cd tests/matrix_free_kokkos
        make compile_test_executables

  #######################
  # debug-cuda-12-clang #
  #######################

  debug-cuda-12-clang:
    # simple parallel debug build using cuda-12 and clang

    name: noble debug cuda-12 clang
    runs-on: ubuntu-24.04

    #
    # The following condition only runs the workflow on 'push' or if the
    # 'pull_request' is not a draft. This is only useful for hackathons or
    # other situations when the CI is massively overburdened with pull
    # requests.
    #
    # if: ${{ github.event_name == 'push' || !github.event.pull_request.draft }}

    env:
      CUDA_ROOT: /usr/local/cuda

    steps:
    - uses: actions/checkout@v7
    - name: modules
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 22
        wget https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
        sudo dpkg -i cuda-keyring_1.1-1_all.deb
        sudo apt-get install -y software-properties-common
        sudo add-apt-repository ppa:ginggs/deal.ii-9.7.1-backports
        sudo apt-get update
        sudo apt-get install -yq --no-install-recommends \
            cuda-toolkit-12-8 \
            libp4est-dev \
            libopenmpi-dev \
            numdiff \
            openmpi-bin \
            libboost-all-dev
    - uses: lukka/get-cmake@v4.4.2
      with:
        cmakeVersion: 3.28.3
    - name: info
      run: |
        mpicc -v
        clang++-22 -v
        cmake --version
    - uses: actions/checkout@v7
      with:
        repository: kokkos/kokkos
        ref: 4.0.01
        path: kokkos
    - name: compile and install kokkos
      working-directory: kokkos
      run: |
        mkdir build
        cd build
        cmake -D BUILD_SHARED_LIBS=ON \
              -D CMAKE_CXX_COMPILER=clang++-22 \
              -D CMAKE_INSTALL_PREFIX=${GITHUB_WORKSPACE}/../kokkos-install \
              -D Kokkos_ENABLE_CUDA=ON \
              -D Kokkos_ARCH_NATIVE=ON \
              -D Kokkos_ARCH_AMPERE80=ON \
              ..
        make install
    - name: configure deal.II
      run: |
        mkdir build
        cd build
        cmake -D CMAKE_BUILD_TYPE=Debug \
              -D CMAKE_CXX_COMPILER=clang++-22 \
              -D DEAL_II_FORCE_BUNDLED_BOOST=ON \
              -D DEAL_II_EARLY_DEPRECATIONS=ON \
              -D DEAL_II_WITH_KOKKOS="ON" \
              -D KOKKOS_DIR=${GITHUB_WORKSPACE}/../kokkos-install \
              -D DEAL_II_WITH_MPI="ON" \
              -D DEAL_II_MPI_WITH_DEVICE_SUPPORT="OFF" \
              -D DEAL_II_WITH_P4EST="ON" \
              ..
    - name: print detailed.log
      run: cat build/detailed.log
    - name: build deal.II
      run: |
        cd build
        make VERBOSE=1
    - name: build CUDA tests
      run: |
        cd build
        make setup_tests_matrix_free_kokkos
        cd tests/matrix_free_kokkos
        make compile_test_executables

  ####################
  # clang-22-modules #
  ####################

  clang-22-modules:
    # simple build testing C++20 modules

    name: resolute clang-22 modules
    runs-on: ubuntu-26.04
    container:
      image: dealii/dependencies:noble-v9.7.1

    # The following condition only runs the workflow on 'push' or if the
    # 'pull_request' is not a draft. This is only useful for hackathons or
    # other situations when the CI is massively overburdened with pull
    # requests.
    #
    # if: ${{ github.event_name == 'push' || !github.event.pull_request.draft }}

    steps:
    - name: modules
      run: |
        sudo apt-get install software-properties-common
        sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
        sudo apt-get update
        sudo apt-get install -yq --no-install-recommends \
            ninja-build wget lsb-release gnupg g++-15
        sudo wget https://apt.llvm.org/llvm.sh && sudo chmod +x llvm.sh && sudo ./llvm.sh 22
    - uses: actions/checkout@v7
      with:
        repository: kokkos/kokkos
        ref: 5.0.1
        path: kokkos
    - name: compile and install kokkos
      working-directory: kokkos
      run: |
        mkdir build
        cd build
        cmake -GNinja \
              -D BUILD_SHARED_LIBS=ON \
              -D CMAKE_CXX_COMPILER=clang++-22 \
              -D CMAKE_CXX_STANDARD=23 \
              -D CMAKE_INSTALL_PREFIX=${GITHUB_WORKSPACE}/../kokkos-install \
              ..
        ninja install
    - uses: actions/checkout@v7
    - name: configure deal.II
      run: |
        mkdir build
        cd build
        cmake -D CMAKE_BUILD_TYPE=Debug \
              -D CMAKE_CXX_STANDARD=23 \
              -D CMAKE_C_COMPILER=clang-22 \
              -D CMAKE_CXX_COMPILER=clang++-22 \
              -D DEAL_II_EARLY_DEPRECATIONS=ON \
              -D DEAL_II_WITH_CXX20_MODULE=ON \
              -D DEAL_II_WITH_CGAL=OFF \
              -D DEAL_II_WITH_HDF5=OFF \
              -D DEAL_II_WITH_MPI=ON \
              -D DEAL_II_WITH_TRILINOS=OFF \
              -D KOKKOS_DIR=${GITHUB_WORKSPACE}/../kokkos-install \
              -G Ninja \
              ..
    - name: print detailed.log
      run: cat build/detailed.log
    - name: build deal.II
      run: |
        cd build
        ninja --verbose dealii_module_debug
